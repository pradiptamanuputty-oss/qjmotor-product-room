    border: 1px solid var(--border, var(--qj-border));

    border-radius: 999px;
    padding: 5px 13px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .15s;

  .chip:hover { border-color: var(--qj); color: var(--qj); }
  .chip.active { background: var(--qj); border-color: var(--qj); color: #fff; }

  .card {

    transition: border-color .15s;

  .card.pending { border-style: dashed; }

  .pow { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; }
  .tr { margin: 0; font-size: 11.5px; color: var(--muted-foreground, var(--qj-muted)); }

const grid = document.getElementById("grid");
const chips = document.getElementById("chips");

const COUNTS = { semua: PRODUCTS.length };
PRODUCTS.forEach(p => { COUNTS[p.cat] = (COUNTS[p.cat] || 0) + 1; });
const CATS = [["semua","Semua"],["sport","Sport"],["adventure","Adventure"],["cruiser","Cruiser"],["scooter","Scooter"]];

function filter(cat) {
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = (cat === "semua" || c.dataset.cat === cat) ? "" : "none";
  });
}

CATS.forEach(([k, label]) => {
  const b = document.createElement("button");
  b.className = "chip" + (k === "semua" ? " active" : "");
  b.textContent = label + " (" + COUNTS[k] + ")";
  b.onclick = () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    b.classList.add("active");
    filter(k);
  };
  chips.appendChild(b);
});

function card(p) {
  const el = document.createElement("article");
  el.className = "card" + (p.pending ? " pending" : "");
  el.dataset.cat = p.cat;
  el.setAttribute("data-hermes-send",
    "Jelaskan detail QJMOTOR " + p.n + ": spesifikasi, fitur kunci, dan angle konten yang menarik.");
  const catColor = CATHEX[p.cat];
  const dots = p.c.map(cn =>
    '<span class="dot" style="background:' + (COLORHEX[cn] || "#999") + '"></span>'
  ).join("");
  const colors = p.c.length
    ? '<div class="colors"><div class="dots">' + dots + '</div><span class="cnames">' + p.c.join(" · ") + '</span></div>'
    : "";
  const features = p.f.map(x => "<span>" + x + "</span>").join("");
  el.innerHTML =
    '<div class="top">' +
      '<span class="cat" style="background:' + catColor + '1a;color:' + catColor + '">' + CATLABEL[p.cat] + '</span>' +
      '<span class="cc">' + (p.cc ? p.cc + " CC" : "SPEK TBA") + '</span>' +
    '</div>' +
    '<h3>' + p.n + '</h3>' +
    '<p class="tag">' + p.tag + '</p>' +
    '<p class="spec">' + p.eng + '</p>' +
    '<p class="pow">' + p.pow + '</p>' +
    '<p class="tr">' + p.tr + '</p>' +
    '<dl class="stats">' +
      '<div><dt>Berat</dt><dd>' + p.w + '</dd></div>' +
      '<div><dt>Jok</dt><dd>' + (p.seat ? p.seat + " mm" : "—") + '</dd></div>' +
      '<div><dt>GC</dt><dd>' + (p.gc === "—" ? "—" : p.gc + " mm") + '</dd></div>' +
      '<div><dt>Tangki</dt><dd>' + p.tank + '</dd></div>' +
    '</dl>' +
    '<p class="dims">' + p.dims + '</p>' +
    '<div class="f">' + features + '</div>' +
    colors +
    (p.note ? '<p class="note">' + p.note + '</p>' : "");
  return el;
}

PRODUCTS.forEach(p => grid.appendChild(card(p)));

const TYPEHEX = { "TAMBAH":"#3e7c4f", "UBAH":"#b06a1b", "KOREKSI":"#c8102e", "INFO":"#2e6fb8" };

function inline(s) {
  return s.replace(/\*\*/g, "").replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderLog(md) {
  const groups = [];
  let curG = null, curE = null;
  md.split("\n").forEach(line => {
    const h = line.match(/^##\s+(.+)/);
    if (h) { curG = { date: h[1].trim(), entries: [] }; groups.push(curG); curE = null; return; }
    const b = line.match(/^\s*-\s+`\[(TAMBAH|UBAH|KOREKSI|INFO)\]`\s+\*\*(.+?)\*\*(.*)$/);
    if (b && curG) { curE = { type: b[1], title: b[2], body: b[3].trim(), subs: [] }; curG.entries.push(curE); return; }
    const s = line.match(/^\s+-\s+(.+)/);
    if (s && curE) curE.subs.push(s[1].trim());
  });
  if (!groups.length) return '<p class="logmeta">Log kosong.</p>';
  return groups.map(g =>
    '<div class="loggroup"><div class="logdate">' + g.date + '</div>' +
    g.entries.map(e => {
      const c = TYPEHEX[e.type] || "#666";
      const body = e.body ? '<span class="ebody">' + inline(e.body) + '</span>' : "";
      const subs = e.subs.length ? '<p class="sub">– ' + e.subs.map(inline).join('<br>– ') + '</p>' : "";
      return '<div class="entry">' +
        '<span class="badge" style="background:' + c + '1a;color:' + c + '">' + e.type + '</span>' +
        '<span class="etitle">' + inline(e.title) + '</span>' +
        body + subs +
      '</div>';
    }).join("") +
    '</div>'
  ).join("");
}

let logLive = false;
async function loadLog(force) {
  if (!force && document.getElementById("log-holder").childElementCount) return;
  let md = null;
  try {
    const r = await fetch("knowledge/PRODUCT_LOG.md", { cache: "no-store" });
    if (r.ok) { md = await r.text(); logLive = true; }
  } catch (e) { logLive = false; }
  if (!md) md = document.getElementById("log-snapshot").textContent.trim();
  document.getElementById("log-holder").innerHTML = renderLog(md);
  document.getElementById("log-meta").textContent = logLive
    ? "Live dari knowledge/PRODUCT_LOG.md — selalu sinkron"
    : "Snapshot ter-embed (fetch tidak tersedia di frame) — sumber: knowledge/PRODUCT_LOG.md";
}

/* ---- Tab switching ---- */
let activeView = "lineup";
try { activeView = localStorage.getItem("qj-artifact") || "lineup"; } catch (e) {}

function show(view) {
  activeView = view;
  document.getElementById("view-lineup").hidden = view !== "lineup";
  document.getElementById("view-log").hidden = view !== "log";
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.view === view));
  try { localStorage.setItem("qj-artifact", view); } catch (e) {}
  if (view === "log") loadLog(logLive);
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => show(t.dataset.view);
});

show(activeView);
loadLog(false);
</script>
</body>
</html>
